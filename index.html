<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Task Checklist - Maternity Leave Planning</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 30px;
            border-radius: 12px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover, .btn-primary:active {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: white;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: #f5f5f7;
        }

        .btn-ai {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        /* Notepad Section */
        .notepad-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .notepad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .notepad-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notepad-toggle {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .notepad-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .notepad-content {
            display: none;
        }

        .notepad-content.show {
            display: block;
        }

        .notepad-textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 15px;
        }

        .notepad-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .notepad-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .api-key-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e8e8ed;
        }

        .api-key-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .api-key-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .ai-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }

        .ai-status.show {
            display: block;
        }

        .ai-status.loading {
            background: #e3f2fd;
            color: #1565c0;
        }

        .ai-status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .ai-status.error {
            background: #ffebee;
            color: #c62828;
        }

        /* Horizons - Mobile swipe container */
        .horizons-wrapper {
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin: 0 -20px;
            padding: 0 20px;
        }

        .horizons-wrapper::-webkit-scrollbar {
            display: none;
        }

        .horizons {
            display: flex;
            gap: 20px;
            min-width: min-content;
        }

        .horizon-column {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-width: 300px;
            flex: 1;
            scroll-snap-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .horizon-column.drag-over {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            border: 2px dashed #667eea;
        }

        .horizon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f5f5f7;
        }

        .horizon-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .horizon-count {
            background: #f5f5f7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #666;
        }

        .horizon-now .horizon-header { border-bottom-color: #ff9500; }
        .horizon-on-leave .horizon-header { border-bottom-color: #34c759; }
        .horizon-after-leave .horizon-header { border-bottom-color: #007aff; }
        .horizon-completed .horizon-header { border-bottom-color: #8e8e93; }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 100px;
        }

        .task-item {
            background: #f9f9fb;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s;
            touch-action: none;
            user-select: none;
        }

        .task-item:hover {
            background: #f0f0f5;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-name {
            text-decoration: line-through;
        }

        .task-item.dragging {
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            position: fixed;
            pointer-events: none;
            background: white;
        }

        .task-item.drag-placeholder {
            opacity: 0.3;
            border: 2px dashed #667eea;
            background: transparent;
        }

        .task-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .task-category {
            font-size: 0.75rem;
            padding: 2px 8px;
            background: #e8e8ed;
            border-radius: 4px;
            color: #666;
        }

        .task-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .task-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            color: #8e8e93;
            font-size: 1.1rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .task-action-btn:hover, .task-action-btn:active {
            background: #e8e8ed;
            color: #1d1d1f;
        }

        .task-notes {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e8e8ed;
        }

        .task-notes-text {
            font-size: 0.85rem;
            color: #666;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }

        .task-notes-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #d2d2d7;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }

        .task-notes-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #8e8e93;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header {
                padding: 20px 15px;
                border-radius: 0;
                margin: -15px -15px 20px -15px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .stats {
                gap: 20px;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .horizons-wrapper {
                margin: 0 -15px;
                padding: 0 15px;
            }

            .horizon-column {
                min-width: 85vw;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            .notepad-actions {
                flex-direction: column;
            }

            .notepad-actions .btn {
                width: 100%;
            }
        }

        @media (min-width: 769px) {
            .horizons-wrapper {
                overflow-x: visible;
            }

            .horizons {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .horizon-column {
                min-width: auto;
            }

            .horizon-column.horizon-completed {
                grid-column: span 3;
            }
        }

        /* Category colors */
        .cat-people { background: #ffeaa7; }
        .cat-statecraft { background: #dfe6e9; }
        .cat-finance { background: #81ecec; }
        .cat-household { background: #fab1a0; }
        .cat-personal-admin { background: #a29bfe; color: white; }
        .cat-personal-tech { background: #74b9ff; }
        .cat-family-decisions { background: #fd79a8; color: white; }
        .cat-health { background: #55efc4; }
        .cat-personal-creative-goals { background: #fdcb6e; }

        /* Drag indicator on mobile */
        .drag-handle {
            cursor: grab;
            padding: 4px;
            color: #ccc;
            font-size: 1rem;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* Column indicator dots for mobile */
        .column-indicators {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .column-indicators {
                display: flex;
            }
        }

        .column-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d2d2d7;
            transition: all 0.2s;
        }

        .column-dot.active {
            background: #667eea;
            transform: scale(1.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Maternity Leave Task Planner</h1>
            <p>Track your tasks before, during, and after leave</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="stat-completed">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="stat-remaining">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
            </div>
        </header>

        <!-- Notepad Section -->
        <div class="notepad-section">
            <div class="notepad-header" onclick="toggleNotepad()">
                <span class="notepad-title">
                    <span class="notepad-toggle" id="notepad-toggle">▼</span>
                    Quick Notes & Task Import
                </span>
            </div>
            <div class="notepad-content" id="notepad-content">
                <textarea class="notepad-textarea" id="notepad-text" placeholder="Dump your thoughts, notes, or task ideas here...

Example:
- Need to call the pediatrician
- Research daycare options (Finance? Family?)
- Buy diapers before next week"></textarea>
                <div class="notepad-actions">
                    <button class="btn btn-ai" onclick="categorizeWithAI()">
                        ✨ Categorize with Claude
                    </button>
                    <button class="btn btn-secondary" onclick="clearNotepad()">Clear</button>
                </div>
                <div class="ai-status" id="ai-status"></div>
                <div class="api-key-section">
                    <label class="api-key-label">Anthropic API Key (stored locally in your browser)</label>
                    <input type="password" class="api-key-input" id="api-key"
                           placeholder="sk-ant-..."
                           onchange="saveApiKey(this.value)">
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="openAddModal()">+ Add New Task</button>
            <button class="btn btn-secondary" onclick="toggleCompleted()">
                <span id="toggle-completed-text">Show Completed</span>
            </button>
        </div>

        <div class="horizons-wrapper" id="horizons-wrapper">
            <div class="horizons" id="horizons">
                <div class="horizon-column horizon-now" data-horizon="Now">
                    <div class="horizon-header">
                        <span class="horizon-title">Now (Before Leave)</span>
                        <span class="horizon-count" id="count-now">0</span>
                    </div>
                    <div class="task-list" id="list-now"></div>
                </div>

                <div class="horizon-column horizon-on-leave" data-horizon="On Leave">
                    <div class="horizon-header">
                        <span class="horizon-title">On Leave</span>
                        <span class="horizon-count" id="count-on-leave">0</span>
                    </div>
                    <div class="task-list" id="list-on-leave"></div>
                </div>

                <div class="horizon-column horizon-after-leave" data-horizon="After Leave">
                    <div class="horizon-header">
                        <span class="horizon-title">After Leave</span>
                        <span class="horizon-count" id="count-after-leave">0</span>
                    </div>
                    <div class="task-list" id="list-after-leave"></div>
                </div>

                <div class="horizon-column horizon-completed" id="completed-column" data-horizon="Completed" style="display: none;">
                    <div class="horizon-header">
                        <span class="horizon-title">Completed</span>
                        <span class="horizon-count" id="count-completed">0</span>
                    </div>
                    <div class="task-list" id="list-completed"></div>
                </div>
            </div>
        </div>

        <div class="column-indicators" id="column-indicators">
            <div class="column-dot active" data-index="0"></div>
            <div class="column-dot" data-index="1"></div>
            <div class="column-dot" data-index="2"></div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Add New Task</h2>
            <form id="task-form" onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-name">Task Name *</label>
                    <input type="text" id="task-name" required placeholder="What needs to be done?">
                </div>
                <div class="form-group">
                    <label for="task-category">Category *</label>
                    <select id="task-category" required>
                        <option value="">Select category...</option>
                        <option value="PEOPLE">People</option>
                        <option value="STATECRAFT">Statecraft</option>
                        <option value="FINANCE">Finance</option>
                        <option value="HOUSEHOLD">Household</option>
                        <option value="PERSONAL ADMIN">Personal Admin</option>
                        <option value="PERSONAL TECH">Personal Tech</option>
                        <option value="FAMILY DECISIONS">Family Decisions</option>
                        <option value="HEALTH">Health</option>
                        <option value="PERSONAL / CREATIVE GOALS">Personal / Creative Goals</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-horizon">Horizon *</label>
                    <select id="task-horizon" required>
                        <option value="Now">Now (Before Leave)</option>
                        <option value="On Leave">On Leave</option>
                        <option value="After Leave">After Leave</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-notes-field">Notes</label>
                    <textarea id="task-notes-field" placeholder="Add any additional details..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

            // PERSONAL TECH
            { id: 33, task: "Buy domain and host personal site", category: "PERSONAL TECH", horizon: "Now", notes: "", completed: false },
            { id: 34, task: "Build food ordering / meal planning system", category: "PERSONAL TECH", horizon: "After Leave", notes: "", completed: false },
            { id: 35, task: "Sort and process Twitter bookmarks", category: "PERSONAL TECH", horizon: "After Leave", notes: "", completed: false },

            // FAMILY DECISIONS
            { id: 36, task: "Choose baby name", category: "FAMILY DECISIONS", horizon: "Now", notes: "", completed: false },
            { id: 37, task: "Decide summer travel (weddings)", category: "FAMILY DECISIONS", horizon: "Now", notes: "", completed: false },

            // HEALTH
            { id: 38, task: "Collect PT records and knee assessment", category: "HEALTH", horizon: "Now", notes: "", completed: false },

            // PERSONAL / CREATIVE GOALS
            { id: 39, task: "Think seriously about writing a book", category: "PERSONAL / CREATIVE GOALS", horizon: "On Leave", notes: "", completed: false },
            { id: 40, task: "Reading (25-30 books target)", category: "PERSONAL / CREATIVE GOALS", horizon: "On Leave", notes: "", completed: false },
            { id: 41, task: "Reach 2300 blitz chess rating", category: "PERSONAL / CREATIVE GOALS", horizon: "After Leave", notes: "", completed: false },
        ];

        // State
        let tasks = [];
        let showCompleted = false;
        let expandedNotes = new Set();
        let notepadVisible = false;

        // Drag state
        let draggedTask = null;
        let draggedElement = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let longPressTimer = null;
        let isDragging = false;

        // Initialize
        function init() {
            const saved = localStorage.getItem('maternity-tasks');
            if (saved) {
                tasks = JSON.parse(saved);
                // Remove confidence from old data
                tasks = tasks.map(t => {
                    const { confidence, ...rest } = t;
                    return rest;
                });
            } else {
                tasks = initialTasks;
            }
            saveTasks();

            // Load API key
            const apiKey = localStorage.getItem('anthropic-api-key');
            if (apiKey) {
                document.getElementById('api-key').value = apiKey;
            }

            // Load notepad
            const notepadText = localStorage.getItem('notepad-text');
            if (notepadText) {
                document.getElementById('notepad-text').value = notepadText;
            }

            render();
            setupScrollIndicator();
            setupDragAndDrop();
        }

        // Save to localStorage
        function saveTasks() {
            localStorage.setItem('maternity-tasks', JSON.stringify(tasks));
        }

        // Get next ID
        function getNextId() {
            return Math.max(0, ...tasks.map(t => t.id)) + 1;
        }

        // Get category class
        function getCategoryClass(category) {
            const map = {
                'PEOPLE': 'cat-people',
                'STATECRAFT': 'cat-statecraft',
                'FINANCE': 'cat-finance',
                'HOUSEHOLD': 'cat-household',
                'PERSONAL ADMIN': 'cat-personal-admin',
                'PERSONAL TECH': 'cat-personal-tech',
                'FAMILY DECISIONS': 'cat-family-decisions',
                'HEALTH': 'cat-health',
                'PERSONAL / CREATIVE GOALS': 'cat-personal-creative-goals'
            };
            return map[category] || '';
        }

        // Render task item
        function renderTask(task) {
            const isExpanded = expandedNotes.has(task.id);
            return `
                <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                    <div class="task-header">
                        <input type="checkbox" class="task-checkbox"
                            ${task.completed ? 'checked' : ''}
                            onchange="toggleComplete(${task.id})">
                        <div class="task-content">
                            <div class="task-name">${escapeHtml(task.task)}</div>
                            <div class="task-meta">
                                <span class="task-category ${getCategoryClass(task.category)}">${escapeHtml(task.category)}</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="task-action-btn" onclick="event.stopPropagation(); toggleNotes(${task.id})" title="Notes">
                                ${task.notes ? '📝' : '📋'}
                            </button>
                            <button class="task-action-btn" onclick="event.stopPropagation(); openEditModal(${task.id})" title="Edit">✏️</button>
                            <button class="task-action-btn" onclick="event.stopPropagation(); deleteTask(${task.id})" title="Delete">🗑️</button>
                        </div>
                    </div>
                    ${isExpanded ? `
                        <div class="task-notes">
                            ${task.notes ? `<div class="task-notes-text">${escapeHtml(task.notes)}</div>` : ''}
                            <textarea class="task-notes-input"
                                placeholder="Add notes..."
                                onclick="event.stopPropagation()"
                                ontouchstart="event.stopPropagation()"
                                onblur="saveNotes(${task.id}, this.value)">${escapeHtml(task.notes || '')}</textarea>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Render all
        function render() {
            const horizons = ['Now', 'On Leave', 'After Leave'];
            const listIds = ['list-now', 'list-on-leave', 'list-after-leave'];
            const countIds = ['count-now', 'count-on-leave', 'count-after-leave'];

            horizons.forEach((horizon, index) => {
                const filtered = tasks.filter(t => t.horizon === horizon && !t.completed);

                document.getElementById(listIds[index]).innerHTML = filtered.length
                    ? filtered.map(renderTask).join('')
                    : '<div class="empty-state">No tasks</div>';
                document.getElementById(countIds[index]).textContent = filtered.length;
            });

            // Completed
            const completed = tasks.filter(t => t.completed);
            document.getElementById('list-completed').innerHTML = completed.length
                ? completed.map(renderTask).join('')
                : '<div class="empty-state">No completed tasks</div>';
            document.getElementById('count-completed').textContent = completed.length;

            // Stats
            const total = tasks.length;
            const completedCount = completed.length;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-completed').textContent = completedCount;
            document.getElementById('stat-remaining').textContent = total - completedCount;

            // Re-setup drag after render
            setupDragAndDrop();
        }

        // Toggle complete
        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        // Toggle notes
        function toggleNotes(id) {
            if (expandedNotes.has(id)) {
                expandedNotes.delete(id);
            } else {
                expandedNotes.add(id);
            }
            render();
        }

        // Save notes
        function saveNotes(id, notes) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.notes = notes;
                saveTasks();
            }
        }

        // Move task
        function moveTask(id, horizon) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.horizon = horizon;
                task.completed = false;
                saveTasks();
                render();
            }
        }

        // Delete task
        function deleteTask(id) {
            if (confirm('Delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                render();
            }
        }

        // Toggle completed column
        function toggleCompleted() {
            showCompleted = !showCompleted;
            document.getElementById('completed-column').style.display = showCompleted ? 'block' : 'none';
            document.getElementById('toggle-completed-text').textContent = showCompleted ? 'Hide Completed' : 'Show Completed';
        }

        // Open add modal
        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add New Task';
            document.getElementById('task-id').value = '';
            document.getElementById('task-form').reset();
            document.getElementById('modal-overlay').classList.add('show');
        }

        // Open edit modal
        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('modal-title').textContent = 'Edit Task';
            document.getElementById('task-id').value = id;
            document.getElementById('task-name').value = task.task;
            document.getElementById('task-category').value = task.category;
            document.getElementById('task-horizon').value = task.horizon;
            document.getElementById('task-notes-field').value = task.notes || '';
            document.getElementById('modal-overlay').classList.add('show');
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        // Save task
        function saveTask(event) {
            event.preventDefault();

            const id = document.getElementById('task-id').value;
            const taskData = {
                task: document.getElementById('task-name').value,
                category: document.getElementById('task-category').value,
                horizon: document.getElementById('task-horizon').value,
                notes: document.getElementById('task-notes-field').value,
            };

            if (id) {
                const task = tasks.find(t => t.id === parseInt(id));
                if (task) {
                    Object.assign(task, taskData);
                }
            } else {
                tasks.push({
                    id: getNextId(),
                    ...taskData,
                    completed: false
                });
            }

            saveTasks();
            render();
            closeModal();
        }

        // Close modal on overlay click
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) {
                closeModal();
            }
        });

        // ============ NOTEPAD FUNCTIONS ============

        function toggleNotepad() {
            notepadVisible = !notepadVisible;
            document.getElementById('notepad-content').classList.toggle('show', notepadVisible);
            document.getElementById('notepad-toggle').classList.toggle('collapsed', !notepadVisible);
        }

        function clearNotepad() {
            document.getElementById('notepad-text').value = '';
            localStorage.removeItem('notepad-text');
        }

        function saveApiKey(key) {
            localStorage.setItem('anthropic-api-key', key);
        }

        // Auto-save notepad
        document.getElementById('notepad-text').addEventListener('input', (e) => {
            localStorage.setItem('notepad-text', e.target.value);
        });

        // ============ CLAUDE AI INTEGRATION ============

        async function categorizeWithAI() {
            const apiKey = document.getElementById('api-key').value.trim();
            const notepadText = document.getElementById('notepad-text').value.trim();
            const statusEl = document.getElementById('ai-status');

            if (!apiKey) {
                statusEl.className = 'ai-status show error';
                statusEl.textContent = 'Please enter your Anthropic API key first.';
                return;
            }

            if (!notepadText) {
                statusEl.className = 'ai-status show error';
                statusEl.textContent = 'Please add some notes to categorize.';
                return;
            }

            statusEl.className = 'ai-status show loading';
            statusEl.textContent = 'Analyzing your notes with Claude...';

            const categories = [
                'PEOPLE', 'STATECRAFT', 'FINANCE', 'HOUSEHOLD',
                'PERSONAL ADMIN', 'PERSONAL TECH', 'FAMILY DECISIONS',
                'HEALTH', 'PERSONAL / CREATIVE GOALS'
            ];

            const horizons = ['Now', 'On Leave', 'After Leave'];

            const prompt = `You are helping categorize tasks for a maternity leave planning app.

The available categories are: ${categories.join(', ')}

The available time horizons are:
- "Now" = tasks to do before maternity leave
- "On Leave" = tasks to do during maternity leave
- "After Leave" = tasks to do after returning from leave

Given these notes from the user, extract any tasks and categorize them. Return ONLY a JSON array with no other text. Each task should have this exact format:
{"task": "task description", "category": "CATEGORY_NAME", "horizon": "Horizon Name"}

User's notes:
${notepadText}

Return ONLY the JSON array, nothing else:`;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 2048,
                        messages: [{
                            role: 'user',
                            content: prompt
                        }]
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API request failed');
                }

                const data = await response.json();
                const content = data.content[0].text;

                // Parse the JSON response
                let newTasks;
                try {
                    newTasks = JSON.parse(content);
                } catch (e) {
                    // Try to extract JSON from the response
                    const match = content.match(/\[[\s\S]*\]/);
                    if (match) {
                        newTasks = JSON.parse(match[0]);
                    } else {
                        throw new Error('Could not parse AI response');
                    }
                }

                if (!Array.isArray(newTasks) || newTasks.length === 0) {
                    statusEl.className = 'ai-status show error';
                    statusEl.textContent = 'No tasks found in your notes. Try adding more specific items.';
                    return;
                }

                // Add the new tasks
                let addedCount = 0;
                newTasks.forEach(newTask => {
                    if (newTask.task && newTask.category && newTask.horizon) {
                        // Validate category and horizon
                        const validCategory = categories.includes(newTask.category) ? newTask.category : 'PERSONAL ADMIN';
                        const validHorizon = horizons.includes(newTask.horizon) ? newTask.horizon : 'Now';

                        tasks.push({
                            id: getNextId(),
                            task: newTask.task,
                            category: validCategory,
                            horizon: validHorizon,
                            notes: '',
                            completed: false
                        });
                        addedCount++;
                    }
                });

                saveTasks();
                render();

                statusEl.className = 'ai-status show success';
                statusEl.textContent = `Added ${addedCount} task${addedCount !== 1 ? 's' : ''}! Check your columns.`;

                // Clear notepad after successful import
                setTimeout(() => {
                    if (confirm('Tasks added! Clear the notepad?')) {
                        clearNotepad();
                    }
                }, 500);

            } catch (error) {
                console.error('AI Error:', error);
                statusEl.className = 'ai-status show error';
                statusEl.textContent = `Error: ${error.message}`;
            }
        }

        // ============ DRAG AND DROP ============

        function setupDragAndDrop() {
            const taskItems = document.querySelectorAll('.task-item');

            taskItems.forEach(item => {
                // Remove existing listeners by cloning
                const newItem = item.cloneNode(true);
                item.parentNode.replaceChild(newItem, item);

                // Touch events for mobile
                newItem.addEventListener('touchstart', handleTouchStart, { passive: false });
                newItem.addEventListener('touchmove', handleTouchMove, { passive: false });
                newItem.addEventListener('touchend', handleTouchEnd);

                // Mouse events for desktop
                newItem.addEventListener('mousedown', handleMouseDown);
            });

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function handleTouchStart(e) {
            // Don't drag if touching checkbox, buttons, or textarea
            if (e.target.closest('.task-checkbox, .task-action-btn, .task-notes-input, textarea, input')) {
                return;
            }

            const touch = e.touches[0];
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;

            const item = e.currentTarget;
            const taskId = parseInt(item.dataset.id);

            // Start long press timer (300ms to initiate drag)
            longPressTimer = setTimeout(() => {
                startDrag(item, taskId, touch.clientX, touch.clientY);
                // Vibrate if available
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            }, 300);
        }

        function handleTouchMove(e) {
            const touch = e.touches[0];

            // If we haven't started dragging yet, check if we've moved too much
            if (longPressTimer && !isDragging) {
                const dx = Math.abs(touch.clientX - dragStartX);
                const dy = Math.abs(touch.clientY - dragStartY);
                if (dx > 10 || dy > 10) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                    return; // Allow normal scroll
                }
            }

            if (isDragging) {
                e.preventDefault();
                moveDrag(touch.clientX, touch.clientY);
            }
        }

        function handleTouchEnd(e) {
            clearTimeout(longPressTimer);
            longPressTimer = null;

            if (isDragging) {
                endDrag();
            }
        }

        function handleMouseDown(e) {
            if (e.target.closest('.task-checkbox, .task-action-btn, .task-notes-input, textarea, input')) {
                return;
            }

            const item = e.currentTarget;
            const taskId = parseInt(item.dataset.id);

            longPressTimer = setTimeout(() => {
                startDrag(item, taskId, e.clientX, e.clientY);
            }, 200);

            dragStartX = e.clientX;
            dragStartY = e.clientY;
        }

        function handleMouseMove(e) {
            if (longPressTimer && !isDragging) {
                const dx = Math.abs(e.clientX - dragStartX);
                const dy = Math.abs(e.clientY - dragStartY);
                if (dx > 5 || dy > 5) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }

            if (isDragging) {
                moveDrag(e.clientX, e.clientY);
            }
        }

        function handleMouseUp(e) {
            clearTimeout(longPressTimer);
            longPressTimer = null;

            if (isDragging) {
                endDrag();
            }
        }

        function startDrag(item, taskId, x, y) {
            isDragging = true;
            draggedTask = tasks.find(t => t.id === taskId);

            const rect = item.getBoundingClientRect();
            dragOffsetX = x - rect.left;
            dragOffsetY = y - rect.top;

            // Create dragging clone
            draggedElement = item.cloneNode(true);
            draggedElement.classList.add('dragging');
            draggedElement.style.width = rect.width + 'px';
            draggedElement.style.left = (x - dragOffsetX) + 'px';
            draggedElement.style.top = (y - dragOffsetY) + 'px';
            document.body.appendChild(draggedElement);

            // Add placeholder class to original
            item.classList.add('drag-placeholder');
        }

        function moveDrag(x, y) {
            if (!draggedElement) return;

            draggedElement.style.left = (x - dragOffsetX) + 'px';
            draggedElement.style.top = (y - dragOffsetY) + 'px';

            // Check which column we're over
            const columns = document.querySelectorAll('.horizon-column:not(.horizon-completed)');
            columns.forEach(col => {
                const rect = col.getBoundingClientRect();
                const isOver = x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
                col.classList.toggle('drag-over', isOver);
            });
        }

        function endDrag() {
            if (!draggedElement || !draggedTask) {
                isDragging = false;
                return;
            }

            // Find which column we dropped on
            const columns = document.querySelectorAll('.horizon-column:not(.horizon-completed)');
            let targetHorizon = null;

            const dragRect = draggedElement.getBoundingClientRect();
            const centerX = dragRect.left + dragRect.width / 2;
            const centerY = dragRect.top + dragRect.height / 2;

            columns.forEach(col => {
                const rect = col.getBoundingClientRect();
                if (centerX >= rect.left && centerX <= rect.right && centerY >= rect.top && centerY <= rect.bottom) {
                    targetHorizon = col.dataset.horizon;
                }
                col.classList.remove('drag-over');
            });

            // Remove dragging element
            draggedElement.remove();
            draggedElement = null;

            // Remove placeholder
            document.querySelectorAll('.drag-placeholder').forEach(el => {
                el.classList.remove('drag-placeholder');
            });

            // Move task if dropped on a valid column
            if (targetHorizon && targetHorizon !== draggedTask.horizon) {
                moveTask(draggedTask.id, targetHorizon);
                // Vibrate on successful drop
                if (navigator.vibrate) {
                    navigator.vibrate([30, 20, 30]);
                }
            }

            draggedTask = null;
            isDragging = false;
        }

        // ============ SCROLL INDICATOR ============

        function setupScrollIndicator() {
            const wrapper = document.getElementById('horizons-wrapper');
            const dots = document.querySelectorAll('.column-dot');

            wrapper.addEventListener('scroll', () => {
                const scrollLeft = wrapper.scrollLeft;
                const columnWidth = wrapper.querySelector('.horizon-column').offsetWidth + 20;
                const activeIndex = Math.round(scrollLeft / columnWidth);

                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === activeIndex);
                });
            });
        }

        // Initialize
        init();
    </script>
</body>
