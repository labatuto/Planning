<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner — Maternity Leave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1128;
            --bg-secondary: #231738;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-bg-hover: rgba(255, 255, 255, 0.09);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0e6f6;
            --text-secondary: #b8a9c8;
            --text-muted: #7d6b8f;
            --sunset-1: #f7a072;
            --sunset-2: #e8636f;
            --sunset-3: #c471db;
            --sunset-4: #7b68ee;
            --coral: #e8636f;
            --peach: #f7a072;
            --golden: #f0c060;
            --teal: #4ecdc4;
            --lavender: #b19cd9;
            --blush: #f49ac2;
            --border: rgba(255, 255, 255, 0.06);
            --shadow: rgba(0, 0, 0, 0.3);
            --radius: 14px;
            --radius-sm: 10px;
            --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(196, 113, 219, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 0%, rgba(247, 160, 114, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(123, 104, 238, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ---- Compact Header ---- */
        header {
            padding: 14px 20px 12px;
            background: linear-gradient(135deg, var(--golden) 0%, var(--sunset-2) 40%, var(--sunset-3) 70%, var(--sunset-4) 100%);
            color: white;
            margin-bottom: 12px;
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.12) 100%);
            pointer-events: none;
        }
        .header-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            position: relative;
            gap: 12px;
        }
        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .header-stats {
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.85;
            white-space: nowrap;
        }
        .progress-bar {
            position: relative;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: rgba(255,255,255,0.85);
            border-radius: 2px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ---- Filter Bar ---- */
        .filter-bar {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex: 1;
            min-width: 0;
            padding: 2px 0;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-pill {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-family: var(--font);
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .filter-pill:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }
        .filter-pill.active {
            background: var(--coral);
            color: white;
            border-color: var(--coral);
        }

        /* ---- Toolbar (merged filter + actions) ---- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .toolbar-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .toolbar-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-family: var(--font);
            flex-shrink: 0;
        }
        .toolbar-btn:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }
        .toolbar-btn.active {
            background: var(--coral);
            color: white;
            border-color: var(--coral);
        }
        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--font);
            transition: all 0.2s;
            letter-spacing: -0.01em;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--coral), var(--peach));
            color: white;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }
        .btn-secondary:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }
        /* (notepad button is now a toolbar-btn icon) */

        /* ---- Columns ---- */
        .columns-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }
        .horizon-column {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            transition: box-shadow 0.25s, border-color 0.25s;
            min-height: 120px;
        }
        .horizon-column.drop-target {
            border-color: var(--coral);
            box-shadow: 0 0 20px rgba(232, 99, 111, 0.2), inset 0 0 20px rgba(232, 99, 111, 0.05);
        }
        .horizon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }
        .horizon-now .horizon-header { border-bottom-color: var(--peach); }
        .horizon-on-leave .horizon-header { border-bottom-color: var(--teal); }
        .horizon-after-leave .horizon-header { border-bottom-color: var(--lavender); }
        .horizon-completed .horizon-header { border-bottom-color: var(--text-muted); }

        .horizon-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .horizon-count {
            background: var(--card-bg);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ---- Task Cards ---- */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            transition: all 0.2s;
            cursor: grab;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .task-card:hover {
            background: var(--card-bg-hover);
            border-color: rgba(255,255,255,0.12);
        }
        .task-card.completed {
            opacity: 0.45;
        }
        .task-card.completed .task-name {
            text-decoration: line-through;
        }
        .task-card.dragging {
            opacity: 0.25;
            transform: scale(0.98);
        }
        .task-card.drag-over-above::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 8px;
            right: 8px;
            height: 2px;
            background: var(--coral);
            border-radius: 1px;
        }
        .task-card.drag-over-below::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 8px;
            right: 8px;
            height: 2px;
            background: var(--coral);
            border-radius: 1px;
        }
        .task-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .task-priority {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255,255,255,0.04);
            flex-shrink: 0;
            margin-top: 2px;
            letter-spacing: -0.02em;
        }
        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--coral);
            flex-shrink: 0;
            margin-top: 2px;
        }
        .task-content {
            flex: 1;
            min-width: 0;
        }
        .task-name {
            font-weight: 500;
            font-size: 0.88rem;
            word-break: break-word;
            line-height: 1.4;
        }
        .task-meta {
            display: flex;
            gap: 6px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .task-category {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .task-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .task-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: all 0.2s;
            line-height: 1;
        }
        .task-action-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
        }
        .task-notes {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .task-notes-text {
            font-size: 0.82rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            margin-bottom: 6px;
        }
        .task-notes-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-family: var(--font);
            resize: vertical;
            min-height: 56px;
            background: rgba(0,0,0,0.2);
            color: var(--text-primary);
        }
        .task-notes-input:focus {
            outline: none;
            border-color: var(--coral);
        }

        /* ---- Move menu ---- */
        .move-menu { position: relative; display: inline-block; }
        .move-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 30px var(--shadow);
            z-index: 100;
            min-width: 160px;
            overflow: hidden;
        }
        .move-dropdown.show { display: block; }
        .move-option {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: background 0.15s;
            color: var(--text-secondary);
        }
        .move-option:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }

        /* ---- Notepad Drawer ---- */
        .notepad-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        .notepad-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .notepad-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 400px;
            max-width: 100vw;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            z-index: 501;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .notepad-drawer.show {
            transform: translateX(0);
        }
        .notepad-drag-handle {
            display: none;
        }
        .notepad-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            gap: 14px;
        }
        .notepad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .notepad-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        .notepad-close {
            width: 30px; height: 30px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .notepad-close:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }
        .notepad-textarea {
            flex: 1;
            width: 100%;
            min-height: 0;
            padding: 12px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 0.86rem;
            font-family: var(--font);
            resize: none;
            background: rgba(0,0,0,0.25);
            color: var(--text-primary);
            line-height: 1.5;
        }
        .notepad-textarea:focus {
            outline: none;
            border-color: var(--lavender);
        }
        .notepad-textarea::placeholder { color: var(--text-muted); }
        .notepad-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-ai {
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--font);
            background: linear-gradient(135deg, var(--teal), var(--sunset-4));
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-ai:hover { filter: brightness(1.1); }
        .ai-status {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        /* Mobile: bottom sheet instead of side panel */
        @media (max-width: 900px) {
            .notepad-drawer {
                top: auto; left: 0; right: 0; bottom: 0;
                width: 100%;
                height: 72vh;
                border-left: none;
                border-top: 1px solid var(--border);
                border-radius: 16px 16px 0 0;
                transform: translateY(100%);
            }
            .notepad-drawer.show { transform: translateY(0); }
            .notepad-drag-handle {
                display: block;
                width: 36px; height: 4px;
                background: var(--text-muted);
                border-radius: 2px;
                margin: 10px auto 0;
                opacity: 0.5;
                flex-shrink: 0;
            }
        }

        /* ---- Modal ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            margin-bottom: 18px;
            font-size: 1.15rem;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: var(--font);
            background: rgba(0,0,0,0.2);
            color: var(--text-primary);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--coral);
        }
        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 72px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .btn-danger {
            background: #c0392b;
            color: white;
        }
        .btn-danger:hover { background: #a93226; }

        /* ---- Drag ghost ---- */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.92;
            transform: scale(1.03) rotate(1.5deg);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border: 1px solid var(--coral) !important;
            background: var(--bg-secondary) !important;
            border-radius: var(--radius-sm);
            transition: none;
        }

        /* ---- FAB ---- */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--coral), var(--peach));
            color: white;
            border: none;
            font-size: 1.6rem;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(232, 99, 111, 0.4);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: var(--font);
            line-height: 1;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 28px rgba(232, 99, 111, 0.5);
        }
        .fab:active { transform: scale(0.95); }

        /* ---- Empty state ---- */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ---- Category colors ---- */
        .cat-people { background: rgba(240, 192, 96, 0.2); color: var(--golden); }
        .cat-statecraft { background: rgba(232, 99, 111, 0.15); color: #f09090; }
        .cat-finance { background: rgba(78, 205, 196, 0.18); color: var(--teal); }
        .cat-household { background: rgba(247, 160, 114, 0.18); color: var(--peach); }
        .cat-personal { background: rgba(177, 156, 217, 0.2); color: var(--lavender); }
        .cat-health { background: rgba(78, 205, 140, 0.18); color: #6ddba0; }
        .cat-personal-creative-goals { background: rgba(244, 154, 194, 0.18); color: var(--blush); }
        .cat-rafa { background: rgba(123, 104, 238, 0.2); color: #9d8df0; }
        .cat-nic { background: rgba(240, 192, 96, 0.18); color: #e8c86a; }

        /* ---- Responsive ---- */
        @media (max-width: 900px) {
            .columns-container {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                gap: 12px;
                padding-bottom: 12px;
                scrollbar-width: none;
            }
            .columns-container::-webkit-scrollbar { display: none; }
            .horizon-column {
                min-width: 82vw;
                scroll-snap-align: start;
                flex-shrink: 0;
            }
            .horizon-column:first-child { margin-left: 0; }
            .container { padding: 10px; }
            header { padding: 12px 16px 10px; margin-bottom: 10px; }
            header h1 { font-size: 1.05rem; }
            .fab { bottom: 20px; right: 16px; width: 48px; height: 48px; font-size: 1.4rem; }
        }

        @media (max-width: 500px) {
            .horizon-column { min-width: 88vw; }
            .toolbar-btn { width: 32px; height: 32px; font-size: 0.9rem; }
        }

        /* ---- Column nav dots (mobile) ---- */
        .column-dots {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        @media (max-width: 900px) {
            .column-dots { display: flex; }
        }
        .column-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.3;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .column-dot.active {
            opacity: 1;
            background: var(--coral);
            transform: scale(1.3);
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-secondary);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font);
            z-index: 9000;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* ---- Sync confirmation banner ---- */
        .sync-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(135deg, var(--coral), var(--peach));
            color: white;
            padding: 14px 20px;

    <script>
        // ================================================

            { id: 30, task: "Buy new slacks", category: "PERSONAL", horizon: "Now", notes: "", completed: false, priority: 27 },

            { id: 33, task: "Buy domain and host personal site", category: "PERSONAL", horizon: "Now", notes: "", completed: false, priority: 28 },
            { id: 34, task: "Build food ordering / meal planning system", category: "PERSONAL", horizon: "After Leave", notes: "", completed: false, priority: 3 },
            { id: 35, task: "Sort and process Twitter bookmarks", category: "PERSONAL", horizon: "After Leave", notes: "", completed: false, priority: 4 },
            { id: 36, task: "Choose baby name", category: "HOUSEHOLD", horizon: "Now", notes: "", completed: false, priority: 29 },
            { id: 37, task: "Decide summer travel (weddings)", category: "HOUSEHOLD", horizon: "Now", notes: "", completed: false, priority: 30 },
            { id: 38, task: "Collect PT records and knee assessment", category: "HEALTH", horizon: "Now", notes: "", completed: false, priority: 31 },
            { id: 39, task: "Think seriously about writing a book", category: "PERSONAL / CREATIVE GOALS", horizon: "On Leave", notes: "", completed: false, priority: 4 },
            { id: 40, task: "Reading (25-30 books target)", category: "PERSONAL / CREATIVE GOALS", horizon: "On Leave", notes: "", completed: false, priority: 5 },
            { id: 41, task: "Reach 2300 blitz chess rating", category: "PERSONAL / CREATIVE GOALS", horizon: "After Leave", notes: "", completed: false, priority: 5 },
        ];

        // ================================================
        // State
        // ================================================
        let tasks = [];
        let activeFilter = 'ALL';
        let showCompleted = false;
        let expandedNotes = new Set();
        let notepadText = '';
        let apiKey = '';

        // Drag state
        let dragState = null;

        // ================================================
        // Initialization
        // ================================================
        function init() {
            const saved = localStorage.getItem('maternity-tasks-v2');
            if (saved) {
                try {
                    tasks = JSON.parse(saved);
                    tasks = migrateTasks(tasks);
                } catch (e) {
                    tasks = JSON.parse(JSON.stringify(initialTasks));
                }
            } else {
                const v1 = localStorage.getItem('maternity-tasks');
                if (v1) {
                    try {
                        tasks = JSON.parse(v1);
                        tasks = migrateTasks(tasks);
                    } catch (e) {
                        tasks = JSON.parse(JSON.stringify(initialTasks));
                    }
                } else {
                    tasks = JSON.parse(JSON.stringify(initialTasks));
                }
            }
            assignPriorities();
            saveTasks();

            notepadText = localStorage.getItem('maternity-notepad') || '';
            document.getElementById('notepad-textarea').value = notepadText;

            apiKey = localStorage.getItem('maternity-apikey') || '';

            renderFilterBar();
            render();
            initDragAndDrop();
            initColumnDots();
            checkUrlForSync();
        }

        function migrateTasks(taskList) {
            return taskList.map(t => {
                const migrated = { ...t };
                if (CATEGORY_MIGRATION[migrated.category]) {
                    migrated.category = CATEGORY_MIGRATION[migrated.category];
                }
                delete migrated.confidence;
                if (migrated.priority === undefined) {
                    migrated.priority = 999;
                }
                return migrated;
            });
        }

        function assignPriorities() {
            HORIZONS.forEach(horizon => {
                const horizonTasks = tasks
                    .filter(t => t.horizon === horizon && !t.completed)
                    .sort((a, b) => (a.priority || 999) - (b.priority || 999));
                horizonTasks.forEach((t, i) => { t.priority = i + 1; });
            });
        }

        // ================================================
        // Persistence
        // ================================================
        function saveTasks() {
            localStorage.setItem('maternity-tasks-v2', JSON.stringify(tasks));
        }

        function saveNotepad() {
            notepadText = document.getElementById('notepad-textarea').value;
            localStorage.setItem('maternity-notepad', notepadText);
        }

        // ================================================
        // Sync & Sharing
        // ================================================
        async function compressAndEncode(data) {
            const json = JSON.stringify(data);
            try {
                const blob = new Blob([json]);
                const stream = blob.stream().pipeThrough(new CompressionStream('deflate'));
                const buf = await new Response(stream).arrayBuffer();
                const bytes = new Uint8Array(buf);
                let bin = '';
                for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
                return 'z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                return 'b' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
        }

        async function decodeAndDecompress(encoded) {
            const prefix = encoded[0];
            const b64 = encoded.slice(1).replace(/-/g, '+').replace(/_/g, '/');
            const padded = b64 + '==='.slice(0, (4 - b64.length % 4) % 4);

            if (prefix === 'z') {
                const bin = atob(padded);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const blob = new Blob([bytes]);
                const stream = blob.stream().pipeThrough(new DecompressionStream('deflate'));
                const text = await new Response(stream).text();
                return JSON.parse(text);
            } else {
                const json = decodeURIComponent(escape(atob(padded)));
                return JSON.parse(json);
            }
        }

        async function shareTasks() {
            try {
                const encoded = await compressAndEncode(tasks);
                const url = window.location.origin + window.location.pathname + '#sync=' + encoded;

                if (navigator.share) {
                    try {
                        await navigator.share({ title: 'Task Planner', url: url });
                        showToast('Shared!');
                        return;
                    } catch (e) {
                        if (e.name === 'AbortError') return;
                    }
                }

                await navigator.clipboard.writeText(url);
                showToast('Link copied! Open it on your other device.');
            } catch (e) {
                showToast('Could not create share link.');
            }
        }

        async function checkUrlForSync() {
            const hash = window.location.hash;
            if (!hash.startsWith('#sync=')) return;
            const encoded = hash.slice(6);
            if (!encoded) return;
            try {
                const imported = await decodeAndDecompress(encoded);
                if (!Array.isArray(imported) || imported.length === 0) return;
                showSyncBanner(imported);
            } catch (e) {
                showToast('Could not read shared link.');
                history.replaceState(null, '', window.location.pathname);
            }
        }

        function showSyncBanner(importedTasks) {
            const banner = document.getElementById('sync-banner');
            const count = importedTasks.length;
            const completed = importedTasks.filter(t => t.completed).length;
            document.getElementById('sync-info').textContent =
                count + ' tasks (' + completed + ' done) — load this list?';
            banner.classList.add('show');

            document.getElementById('sync-accept').onclick = function() {
                tasks = migrateTasks(importedTasks);
                assignPriorities();
                saveTasks();
                render();
                banner.classList.remove('show');
                history.replaceState(null, '', window.location.pathname);
                showToast('Tasks synced!');
            };

            document.getElementById('sync-decline').onclick = function() {
                banner.classList.remove('show');
                history.replaceState(null, '', window.location.pathname);
            };
        }

        let toastTimer;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            clearTimeout(toastTimer);
            el.classList.remove('show');
            requestAnimationFrame(function() {
                el.classList.add('show');
                toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
            });
        }

        // ================================================
        // Rendering
        // ================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function getCategoryClass(category) {
            return CATEGORY_CLASS_MAP[category] || '';
        }

        function getNextId() {
            return Math.max(0, ...tasks.map(t => t.id)) + 1;
        }

        function renderFilterBar() {
            const bar = document.getElementById('filter-bar');
            const pills = ['ALL', ...CATEGORIES];
            bar.innerHTML = pills.map(cat => {
                const label = cat === 'ALL' ? 'All' : cat.charAt(0) + cat.slice(1).toLowerCase();
                const active = activeFilter === cat ? ' active' : '';
                return `<button class="filter-pill${active}" onclick="setFilter('${cat}')">${escapeHtml(label)}</button>`;
            }).join('');
        }

        function setFilter(cat) {
            activeFilter = cat;
            renderFilterBar();
            render();
        }

        function renderTask(task, displayNum) {
            const isExpanded = expandedNotes.has(task.id);
            return `
                <div class="task-card ${task.completed ? 'completed' : ''}" data-id="${task.id}" data-horizon="${task.horizon}">
                    <div class="task-header">
                        <span class="task-priority">${displayNum}</span>
                        <input type="checkbox" class="task-checkbox"
                            ${task.completed ? 'checked' : ''}
                            onchange="toggleComplete(${task.id})">
                        <div class="task-content">
                            <div class="task-name">${escapeHtml(task.task)}</div>
                            <div class="task-meta">
                                <span class="task-category ${getCategoryClass(task.category)}">${escapeHtml(task.category)}</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="task-action-btn" onclick="toggleNotes(${task.id})" title="Notes">${task.notes ? '\u{1F4DD}' : '\u{1F4CB}'}</button>
                            <button class="task-action-btn" onclick="openEditModal(${task.id})" title="Edit">\u{270F}\u{FE0F}</button>
                            <div class="move-menu">
                                <button class="task-action-btn" onclick="toggleMoveMenu(event, ${task.id})" title="Move">\u{2194}\u{FE0F}</button>
                                <div class="move-dropdown" id="move-menu-${task.id}">
                                    <div class="move-option" onclick="moveTask(${task.id}, 'Now')">\u{2192} Now</div>
                                    <div class="move-option" onclick="moveTask(${task.id}, 'On Leave')">\u{2192} On Leave</div>
                                    <div class="move-option" onclick="moveTask(${task.id}, 'After Leave')">\u{2192} After Leave</div>
                                </div>
                            </div>
                            <button class="task-action-btn" onclick="deleteTask(${task.id})" title="Delete">\u{1F5D1}\u{FE0F}</button>
                        </div>
                    </div>
                    ${isExpanded ? `
                        <div class="task-notes">
                            ${task.notes ? `<div class="task-notes-text">${escapeHtml(task.notes)}</div>` : ''}
                            <textarea class="task-notes-input"
                                placeholder="Add notes..."
                                oninput="event.stopPropagation()"
                                onblur="saveNotes(${task.id}, this.value)">${escapeHtml(task.notes || '')}</textarea>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function render() {
            const listIds = { 'Now': 'list-now', 'On Leave': 'list-on-leave', 'After Leave': 'list-after-leave' };
            const countIds = { 'Now': 'count-now', 'On Leave': 'count-on-leave', 'After Leave': 'count-after-leave' };

            HORIZONS.forEach(horizon => {
                let filtered = tasks.filter(t => t.horizon === horizon && !t.completed);
                if (activeFilter !== 'ALL') {
                    filtered = filtered.filter(t => t.category === activeFilter);
                }
                const sorted = filtered.sort((a, b) => a.priority - b.priority);

                const listEl = document.getElementById(listIds[horizon]);
                listEl.innerHTML = sorted.length
                    ? sorted.map((t, i) => renderTask(t, i + 1)).join('')
                    : '<div class="empty-state">No tasks</div>';

                // Show total count (unfiltered) in the count badge
                const totalInHorizon = tasks.filter(t => t.horizon === horizon && !t.completed).length;
                document.getElementById(countIds[horizon]).textContent = totalInHorizon;
            });

            // Completed
            let completed = tasks.filter(t => t.completed);
            if (activeFilter !== 'ALL') {
                completed = completed.filter(t => t.category === activeFilter);
            }
            document.getElementById('list-completed').innerHTML = completed.length
                ? completed.map((t, i) => renderTask(t, i + 1)).join('')
                : '<div class="empty-state">No completed tasks</div>';
            document.getElementById('count-completed').textContent = tasks.filter(t => t.completed).length;

            // Header stats + progress bar
            const total = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            const remaining = total - completedCount;
            const pct = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('header-stats').textContent = `${completedCount}/${total} done \u00B7 ${remaining} left`;
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        // ================================================
        // Task CRUD
        // ================================================
        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (!task.completed) {
                    // Re-entering a horizon, put at end
                    const maxP = Math.max(0, ...tasks.filter(t => t.horizon === task.horizon && !t.completed && t.id !== id).map(t => t.priority));
                    task.priority = maxP + 1;
                }
                saveTasks();
                render();
            }
        }

        function toggleNotes(id) {
            if (expandedNotes.has(id)) expandedNotes.delete(id);
            else expandedNotes.add(id);
            render();
        }

        function saveNotes(id, notes) {
            const task = tasks.find(t => t.id === id);
            if (task) { task.notes = notes; saveTasks(); }
        }

        function moveTask(id, horizon) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                const oldHorizon = task.horizon;
                task.horizon = horizon;
                task.completed = false;
                const maxP = Math.max(0, ...tasks.filter(t => t.horizon === horizon && !t.completed && t.id !== id).map(t => t.priority));
                task.priority = maxP + 1;
                renumberPriorities(horizon);
                if (oldHorizon !== horizon) renumberPriorities(oldHorizon);
                saveTasks();
                render();
            }
            closeAllMenus();
        }

        function deleteTask(id) {
            if (confirm('Delete this task?')) {
                const task = tasks.find(t => t.id === id);
                const horizon = task ? task.horizon : null;
                tasks = tasks.filter(t => t.id !== id);
                if (horizon) renumberPriorities(horizon);
                saveTasks();
                render();
            }
        }

        function toggleMoveMenu(event, id) {
            event.stopPropagation();
            closeAllMenus();
            const menu = document.getElementById(`move-menu-${id}`);
            if (menu) menu.classList.toggle('show');
        }

        function closeAllMenus() {
            document.querySelectorAll('.move-dropdown').forEach(m => m.classList.remove('show'));
        }

        function toggleCompleted() {
            showCompleted = !showCompleted;
            document.getElementById('completed-column').style.display = showCompleted ? 'block' : 'none';
            document.getElementById('btn-completed').classList.toggle('active', showCompleted);
        }

        // ================================================
        // Priority / Reorder
        // ================================================
        function renumberPriorities(horizon) {
            const horizonTasks = tasks
                .filter(t => t.horizon === horizon && !t.completed)
                .sort((a, b) => a.priority - b.priority);
            horizonTasks.forEach((t, i) => { t.priority = i + 1; });
        }

        function reorderTask(taskId, targetHorizon, insertBeforeId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const oldHorizon = task.horizon;
            task.horizon = targetHorizon;
            task.completed = false;

            const horizonTasks = tasks
                .filter(t => t.horizon === targetHorizon && !t.completed && t.id !== taskId)
                .sort((a, b) => a.priority - b.priority);

            if (insertBeforeId !== null && insertBeforeId !== undefined) {
                const idx = horizonTasks.findIndex(t => t.id === insertBeforeId);
                if (idx >= 0) {
                    horizonTasks.splice(idx, 0, task);
                } else {
                    horizonTasks.push(task);
                }
            } else {
                horizonTasks.push(task);
            }

            horizonTasks.forEach((t, i) => { t.priority = i + 1; });
            if (oldHorizon !== targetHorizon) renumberPriorities(oldHorizon);
            saveTasks();
            render();
        }

        // ================================================
        // Drag & Drop
        // ================================================
        function initDragAndDrop() {
            const container = document.getElementById('columns-container');

            // --- Desktop: mouse events ---
            container.addEventListener('mousedown', (e) => {
                const card = e.target.closest('.task-card');
                if (!card) return;
                if (e.target.closest('.task-actions, button, input, select, textarea, a, .task-checkbox')) return;

                const startX = e.clientX;
                const startY = e.clientY;
                let started = false;
                const taskId = parseInt(card.dataset.id);

                function onMove(ev) {
                    const dx = Math.abs(ev.clientX - startX);
                    const dy = Math.abs(ev.clientY - startY);
                    if (!started && (dx > 5 || dy > 5)) {
                        started = true;
                        startDrag(card, taskId, ev.clientX, ev.clientY);
                    }
                    if (started) updateDrag(ev.clientX, ev.clientY);
                }
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (started) endDrag();
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            // --- Mobile: touch events with long-press ---
            let holdTimer = null;
            let touchStart = null;

            container.addEventListener('touchstart', (e) => {
                const card = e.target.closest('.task-card');
                if (!card) return;
                if (e.target.closest('.task-actions, button, input, select, textarea, a, .task-checkbox')) return;

                const touch = e.touches[0];
                touchStart = { x: touch.clientX, y: touch.clientY };
                const taskId = parseInt(card.dataset.id);

                holdTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(40);
                    startDrag(card, taskId, touch.clientX, touch.clientY);
                }, 400);
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!touchStart) return;
                const touch = e.touches[0];
                const dx = Math.abs(touch.clientX - touchStart.x);
                const dy = Math.abs(touch.clientY - touchStart.y);

                if (holdTimer && (dx > 8 || dy > 8)) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }

                if (dragState && dragState.active) {
                    e.preventDefault();
                    updateDrag(touch.clientX, touch.clientY);
                }
            }, { passive: false });

            document.addEventListener('touchend', () => {
                if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                touchStart = null;
                if (dragState && dragState.active) endDrag();
            });

            document.addEventListener('touchcancel', () => {
                if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                touchStart = null;
                if (dragState && dragState.active) cancelDrag();
            });
        }

        function startDrag(cardEl, taskId, x, y) {
            const rect = cardEl.getBoundingClientRect();
            const ghost = cardEl.cloneNode(true);
            ghost.classList.add('drag-ghost');
            ghost.style.width = rect.width + 'px';
            ghost.style.left = rect.left + 'px';
            ghost.style.top = rect.top + 'px';
            document.body.appendChild(ghost);

            cardEl.classList.add('dragging');

            const container = document.getElementById('columns-container');
            container.style.scrollSnapType = 'none';

            dragState = {
                active: true,
                taskId,
                ghost,
                originalCard: cardEl,
                sourceHorizon: tasks.find(t => t.id === taskId)?.horizon,
                targetHorizon: null,
                insertBeforeId: null,
                offsetX: x - rect.left,
                offsetY: y - rect.top,
                autoScrollTimer: null,
            };
        }

        function updateDrag(x, y) {
            if (!dragState || !dragState.active) return;

            dragState.ghost.style.left = (x - dragState.offsetX) + 'px';
            dragState.ghost.style.top = (y - dragState.offsetY) + 'px';

            // Clear previous indicators
            document.querySelectorAll('.task-card.drag-over-above, .task-card.drag-over-below').forEach(c => {
                c.classList.remove('drag-over-above', 'drag-over-below');
            });

            // Detect target column
            const columns = document.querySelectorAll('.horizon-column:not(#completed-column)');
            let targetCol = null;
            columns.forEach(col => {
                const r = col.getBoundingClientRect();
                col.classList.remove('drop-target');
                if (x >= r.left && x <= r.right) {
                    targetCol = col;
                }
            });

            if (targetCol) {
                targetCol.classList.add('drop-target');
                dragState.targetHorizon = targetCol.dataset.horizon;

                // Find insertion position
                const cards = targetCol.querySelectorAll('.task-card:not(.dragging)');
                let insertBeforeId = null;
                let lastCard = null;
                for (const card of cards) {
                    const r = card.getBoundingClientRect();
                    const midY = r.top + r.height / 2;
                    if (y < midY) {
                        insertBeforeId = parseInt(card.dataset.id);
                        card.classList.add('drag-over-above');
                        break;
                    }
                    lastCard = card;
                }
                if (insertBeforeId === null && lastCard) {
                    lastCard.classList.add('drag-over-below');
                }
                dragState.insertBeforeId = insertBeforeId;
            } else {
                dragState.targetHorizon = dragState.sourceHorizon;
                dragState.insertBeforeId = null;
            }

            // Auto-scroll the columns container on mobile
            const container = document.getElementById('columns-container');
            const cr = container.getBoundingClientRect();
            const edge = 50;

            if (dragState.autoScrollTimer) {
                cancelAnimationFrame(dragState.autoScrollTimer);
                dragState.autoScrollTimer = null;
            }

            if (x < cr.left + edge) {
                (function scroll() {
                    container.scrollLeft -= 6;
                    if (dragState && dragState.active) {
                        dragState.autoScrollTimer = requestAnimationFrame(scroll);
                    }
                })();
            } else if (x > cr.right - edge) {
                (function scroll() {
                    container.scrollLeft += 6;
                    if (dragState && dragState.active) {
                        dragState.autoScrollTimer = requestAnimationFrame(scroll);
                    }
                })();
            }
        }

        function endDrag() {
            if (!dragState || !dragState.active) return;

            if (dragState.autoScrollTimer) cancelAnimationFrame(dragState.autoScrollTimer);

            const targetHorizon = dragState.targetHorizon || dragState.sourceHorizon;
            reorderTask(dragState.taskId, targetHorizon, dragState.insertBeforeId);

            cleanup();
        }

        function cancelDrag() {
            if (!dragState) return;
            if (dragState.autoScrollTimer) cancelAnimationFrame(dragState.autoScrollTimer);
            cleanup();
            render();
        }

        function cleanup() {
            if (!dragState) return;
            if (dragState.ghost) dragState.ghost.remove();
            document.querySelectorAll('.task-card.dragging').forEach(c => c.classList.remove('dragging'));
            document.querySelectorAll('.horizon-column.drop-target').forEach(c => c.classList.remove('drop-target'));
            document.querySelectorAll('.task-card.drag-over-above, .task-card.drag-over-below').forEach(c => {
                c.classList.remove('drag-over-above', 'drag-over-below');
            });
            const container = document.getElementById('columns-container');
            container.style.scrollSnapType = '';
            dragState = null;
        }

        // ================================================
        // Column dots (mobile navigation indicator)
        // ================================================
        function initColumnDots() {
            const container = document.getElementById('columns-container');
            const dots = document.querySelectorAll('.column-dot');

            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const colIdx = parseInt(dot.dataset.col);
                    const cols = container.querySelectorAll('.horizon-column:not(#completed-column)');
                    if (cols[colIdx]) {
                        cols[colIdx].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
                    }
                });
            });

            container.addEventListener('scroll', () => {
                const cols = container.querySelectorAll('.horizon-column:not(#completed-column)');
                const scrollLeft = container.scrollLeft;
                const colWidth = cols[0]?.offsetWidth || 1;
                const activeIdx = Math.round(scrollLeft / (colWidth + 12));
                dots.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
            });
        }

        // ================================================
        // Notepad & AI
        // ================================================
        function openNotepad() {
            document.getElementById('notepad-backdrop').classList.add('show');
            document.getElementById('notepad-drawer').classList.add('show');
        }
        function closeNotepad() {
            document.getElementById('notepad-backdrop').classList.remove('show');
            document.getElementById('notepad-drawer').classList.remove('show');
        }

        document.getElementById('notepad-backdrop').addEventListener('click', closeNotepad);
        document.getElementById('notepad-textarea').addEventListener('input', saveNotepad);

        function closeApiKeyModal() {
            document.getElementById('apikey-modal').classList.remove('show');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem('maternity-apikey', apiKey);
                closeApiKeyModal();
                categorizeWithAI();
            }
        }

        async function categorizeWithAI() {
            const text = document.getElementById('notepad-textarea').value.trim();
            if (!text) {
                setAiStatus('Notepad is empty.');
                return;
            }

            if (!apiKey) {
                document.getElementById('apikey-modal').classList.add('show');
                return;
            }

            setAiStatus('Thinking...');

            const categories = CATEGORIES.join(', ');
            const horizons = HORIZONS.join(', ');
            const prompt = `You are a task categorization assistant. Given the following freeform notes, extract individual tasks and categorize them.

Available categories (use UPPERCASE exactly as listed): ${categories}
Available horizons: ${horizons}

Existing tasks for context:
${tasks.filter(t => !t.completed).map(t => `- [${t.category}] [${t.horizon}] ${t.task}`).join('\n')}

Notes to categorize:
---
${text}
---

Return ONLY a valid JSON array. Each item should have:
- "task": string (concise task description)
- "category": string (one of the categories above, UPPERCASE)
- "horizon": string (one of: "Now", "On Leave", "After Leave")

Return ONLY the JSON array, no markdown fencing, no explanation.`;

            try {
                const resp = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-5-20250929',
                        max_tokens: 4096,
                        messages: [{ role: 'user', content: prompt }],
                    }),
                });

                if (!resp.ok) {
                    const err = await resp.text();
                    if (resp.status === 401) {
                        setAiStatus('Invalid API key. Click Notepad to re-enter.');
                        apiKey = '';
                        localStorage.removeItem('maternity-apikey');
                    } else {
                        setAiStatus('API error: ' + resp.status);
                    }
                    console.error('AI error:', err);
                    return;
                }

                const data = await resp.json();
                const content = data.content?.[0]?.text || '';

                // Parse JSON — try to extract array from response
                let newTasks;
                try {
                    // Try direct parse first
                    newTasks = JSON.parse(content);
                } catch {
                    // Try extracting JSON from markdown code block
                    const match = content.match(/\[[\s\S]*\]/);
                    if (match) {
                        newTasks = JSON.parse(match[0]);
                    } else {
                        throw new Error('Could not parse AI response');
                    }
                }

                if (!Array.isArray(newTasks) || newTasks.length === 0) {
                    setAiStatus('No tasks found in notes.');
                    return;
                }

                // Add tasks
                let added = 0;
                newTasks.forEach(nt => {
                    if (!nt.task) return;
                    const category = CATEGORIES.includes(nt.category) ? nt.category : 'PERSONAL';
                    const horizon = HORIZONS.includes(nt.horizon) ? nt.horizon : 'Now';
                    const maxP = Math.max(0, ...tasks.filter(t => t.horizon === horizon && !t.completed).map(t => t.priority));
                    tasks.push({
                        id: getNextId(),
                        task: nt.task,
                        category,
                        horizon,
                        notes: '',
                        completed: false,
                        priority: maxP + 1,
                    });
                    added++;
                });

                saveTasks();
                render();
                setAiStatus(`Added ${added} task${added !== 1 ? 's' : ''}!`);

            } catch (err) {
                console.error('AI categorization error:', err);
                setAiStatus('Error: ' + err.message);
            }
        }

        function setAiStatus(msg) {
            document.getElementById('ai-status').textContent = msg;
            if (msg) setTimeout(() => {
                const el = document.getElementById('ai-status');
                if (el.textContent === msg) el.textContent = '';
            }, 6000);
        }

        // ================================================
        // Modal
        // ================================================
        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add New Task';
            document.getElementById('task-id').value = '';
            document.getElementById('task-form').reset();
            document.getElementById('modal-overlay').classList.add('show');
        }

        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            document.getElementById('modal-title').textContent = 'Edit Task';
            document.getElementById('task-id').value = id;
            document.getElementById('task-name').value = task.task;
            document.getElementById('task-category').value = task.category;
            document.getElementById('task-horizon').value = task.horizon;
            document.getElementById('task-notes-field').value = task.notes || '';
            document.getElementById('modal-overlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function saveTaskFromModal(event) {
            event.preventDefault();
            const id = document.getElementById('task-id').value;
            const taskData = {
                task: document.getElementById('task-name').value,
                category: document.getElementById('task-category').value,
                horizon: document.getElementById('task-horizon').value,
                notes: document.getElementById('task-notes-field').value,
            };

            if (id) {
                const task = tasks.find(t => t.id === parseInt(id));
                if (task) {
                    const horizonChanged = task.horizon !== taskData.horizon;
                    const oldHorizon = task.horizon;
                    Object.assign(task, taskData);
                    if (horizonChanged) {
                        const maxP = Math.max(0, ...tasks.filter(t => t.horizon === taskData.horizon && !t.completed && t.id !== task.id).map(t => t.priority));
                        task.priority = maxP + 1;
                        renumberPriorities(taskData.horizon);
                        renumberPriorities(oldHorizon);
                    }
                }
            } else {
                const horizon = taskData.horizon;
                const maxP = Math.max(0, ...tasks.filter(t => t.horizon === horizon && !t.completed).map(t => t.priority));
                tasks.push({
                    id: getNextId(),
                    ...taskData,
                    completed: false,
                    priority: maxP + 1,
                });
            }

            saveTasks();
            render();
            closeModal();
        }

        // ================================================
        // Event Listeners
        // ================================================
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.move-menu')) closeAllMenus();
        });

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) closeModal();
        });

        document.getElementById('apikey-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('apikey-modal')) closeApiKeyModal();
        });

        // Cross-tab sync: pick up changes from another tab on the same device
        window.addEventListener('storage', (e) => {
            if (e.key === 'maternity-tasks-v2' && e.newValue) {
                try {
                    tasks = JSON.parse(e.newValue);
                    tasks = migrateTasks(tasks);
                    assignPriorities();
                    render();
                } catch (err) { /* ignore corrupt data */ }
            }
            if (e.key === 'maternity-notepad') {
                const ta = document.getElementById('notepad-textarea');
                if (ta) ta.value = e.newValue || '';
            }
        });

        // ================================================
        // Initialize
        // ================================================
        init();
    </script>
